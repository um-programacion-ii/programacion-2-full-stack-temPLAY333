# Profile MOCK - Simula servicios de C?tedra sin conexi?n real
# Act?valo con: mvn spring-boot:run -Dspring-boot.run.profiles=mock
# O con JAR: java -jar proxy.jar --spring.profiles.active=mock

# === MODO MOCK ACTIVO ===
# El MockCatedraService reemplaza las llamadas HTTP a C?tedra
# con datos inventados y simula webhooks as?ncronos al Backend

# Backend (para webhooks)
app.backend.base-url=http://localhost:8081
app.backend.webhook-path=/api/webhooks/evento-cambio
# app.backend.token=opcional-si-el-backend-requiere-auth

# Cátedra (no se usa en modo mock, pero debe estar presente)
app.catedra.base-url=http://localhost:9999
# Las credenciales NO están configuradas para evitar que AuthTokenService intente conectarse
# En modo mock, el token JWT no es necesario
app.catedra.username=
app.catedra.password=

# Kafka - DESHABILITADO en modo mock
spring.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=proxy-grupo-mock

# Redis - DESHABILITADO en modo mock
# Deshabilita autoconfiguración de Redis
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Server
server.port=8080

# Deshabilitar tareas programadas (renovación automática de token)
spring.task.scheduling.enabled=false

# Logging
logging.level.um.prog2=DEBUG
logging.level.um.prog2.service.MockCatedraService=DEBUG

# Actuator - Excluir Redis del health check
management.endpoints.web.exposure.include=health,info,auth
management.health.redis.enabled=false

